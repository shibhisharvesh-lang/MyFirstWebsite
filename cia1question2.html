<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="cia1question2.css">
</head>
<body>
  <main class="form-card">
    <h1>Student Registration</h1>
    <p class="intro">Fill in your details to register.</p>

    <form action="#" method="post">
      <div class="form-grid">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" required>
        </div>

        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" name="lastName" type="text" autocomplete="family-name" required>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
        </div>

        <div class="field">
          <label for="dob">Date of birth</label>
          <input id="dob" name="dateOfBirth" type="date" required>
        </div>

        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="">Choose an option</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="nonbinary">Non-binary</option>
            <option value="prefer-not-to-say">Prefer not to say</option>
          </select>
        </div>

        <div class="field">
          <label for="course">Course or program</label>
          <select id="course" name="course" required>
            <option value="">Choose a course</option>
            <option value="computer-science">Computer Science</option>
            <option value="business">Business</option>
            <option value="engineering">Engineering</option>
            <option value="arts">Arts and Humanities</option>
            <option value="science">Science</option>
          </select>
        </div>

        <div class="field">
          <label for="year">Year of study</label>
          <select id="year" name="yearOfStudy" required>
            <option value="">Choose a year</option>
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field full-width">
          <label for="address">Home address</label>
          <textarea id="address" name="address" rows="3" autocomplete="street-address"></textarea>
        </div>

        <label class="checkbox full-width">
          <input type="checkbox" name="terms" required>
          <span>I confirm that the information provided is accurate.</span>
        </label>
      </div>

      <button type="submit">Register</button>
    </form>
  </main>
</body>
</html>
