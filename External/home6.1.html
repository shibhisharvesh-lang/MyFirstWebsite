<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Cards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Our Courses</h1>
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <div class="card h-100"><div class="card-body">
          <h2 class="h5 card-title">HTML & CSS</h2>
          <p class="card-text">Build webpage structure and style.</p>
          <a href="https://www.html.com" class="btn btn-primary">Explore</a>
        </div></div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card h-100"><div class="card-body">
          <h2 class="h5 card-title">JavaScript</h2>
          <p class="card-text">Add logic and interactivity.</p>
          <a href="https://www.javascript.com" class="btn btn-primary">Explore</a>
        </div></div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card h-100"><div class="card-body">
          <h2 class="h5 card-title">Bootstrap</h2>
          <p class="card-text">Create responsive layouts faster.</p>
          <a href="https://www.bootstrap.com" class="btn btn-primary">Explore</a>
        </div></div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
