<html>
    <head>
        <style> 
            .message{display:block;}
            @media (max-width: 600px){
            .message{display:none;}}
        </style>
    </head>
    <body>
        <div class="message">This message is visible on screens wider than 600px.</div>
        <div class="message">This message is also visible on screens wider than 600px.</div>
