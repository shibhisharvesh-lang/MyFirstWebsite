<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Responsive Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            padding: 25px;
            background-color: navy;
            color: white;
            text-align: center;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            flex: 1;
            padding: 300px;
            background-color: lightblue;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                font-size: 14px;
            }

            .cards {
                flex-direction: column;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>My College</h1>
        <p>Responsive Webpage</p>
    </header>

    <div class="cards">
        <div class="card">HTML</div>
        <div class="card">CSS</div>
        <div class="card">JavaScript</div>
    </div>
</body>
</html>
