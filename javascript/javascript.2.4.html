<html>
    <head>
        <title>JavaScript 2.4</title>
    </head>
    <body>
        <input type="number" id="days" placeholder="Enter a number (1-7)">
        <button onclick="displayday(parseInt(document.getElementById('days').value))">Submit</button>
        <script>
            days = parseInt(prompt("Enter a number (1-7):"));
                     function displayday(days) {
                switch(days) {
                    case 1:
                        document.write("Sunday");
                        break;
                    case 2:
                        document.write("Monday");
                        break;
                    case 3: 
                        document.write("Tuesday");
                        break;
                    case 4:
                        document.write("Wednesday");
                        break;
                    case 5:
                        document.write("Thursday");
                        break;
                    case 6:
                        document.write("Friday");
                        break;
                    case 7:
                        document.write("Saturday");
                        break;
                    default:
                        document.write("Invalid day");
                }
            };
        </script>
    </body>
</html>
