<html>
    <head>
        <title>javascript</title>   
    </head>
    <body>
        <script>
            function greet()
            {
                console.log("Hello students");
            }
            let result=greet()
            console.log(result);
            function outer(){
                let message="Hello students";
                function inner(){
                    console.log(message);
                }
                return inner;
                let result=outer()
                result();
            }
        </script>
    </body>
