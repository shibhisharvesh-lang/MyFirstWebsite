<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HTML5 Forms</title>
    <style>
      body {
        font: 16px Arial;
        max-width: 800px;
        margin: 40px auto;
        line-height: 1.6;
      }
      h1 {
        color: #2563eb;
      }
      form {
        background: #f8fafc;
        padding: 20px;
        border-radius: 10px;
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 9px;
        margin-top: 4px;
      }
      button {
        margin-top: 12px;
        padding: 10px 20px;
        background: #2563eb;
        color: white;
        border: 0;
        border-radius: 6px;
      }
      pre {
        background: #111827;
        color: white;
        padding: 15px;
        overflow: auto;
      }
      .ex {
        background: #ecfdf5;
        padding: 15px;
        border-left: 5px solid #16a34a;
      }
    </style>
  </head>
  <body>
    <h1>HTML5: Forms</h1>
    <p>A form collects information from a user.</p>
    <pre>
form&
  &lt;label&gt;Name&lt;/label&gt;
  &lt;input type="text"&gt;
  &lt;button type="submit"&gt;Submit&lt;/button&gt;
&lt;/form&gt;</pre
    >
    <form
      onsubmit="
        event.preventDefault();
        alert('Form submitted!');
      "
    >
      <label>Name</label><input type="text" placeholder="Enter name" /><label
        >Email</label
      ><input type="email" placeholder="Enter email" /><label>Course</label
      >
      <select>
        <option>Cybersecurity Engineering</option>
        <option>CSE</option></select>
      <label>Message</label><textarea rows="4"></textarea
      ><button>Submit</button>
    </form>
    <div class="ex">
      <b>Exercise:</b> Create a Student Registration Form with Name, Email,
      Phone, Department, Year and Submit button.
    </div>
  </body>
</html>
